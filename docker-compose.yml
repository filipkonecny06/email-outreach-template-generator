services:
  db:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      # Local-development defaults only; provide real secrets outside this Compose setup.
      MYSQL_DATABASE: outreach_generator
      MYSQL_USER: outreach
      MYSQL_PASSWORD: outreach
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-plocal-root-password']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      TRUST_PROXY: 'false'
      SESSION_COOKIE_NAME: outreach.sid
      SESSION_SECRET: local-development-secret-change-before-any-deployment-123456
      SESSION_MAX_AGE_MS: 86400000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: outreach_generator
      DB_USER: outreach
      DB_PASSWORD: outreach
      DB_SSL: 'false'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 10
    ports:
      - '3000:3000'
    depends_on:
      # Migrations cannot start reliably until MySQL accepts connections.
      db:
        condition: service_healthy
    # Local startup applies schema changes and the validated, version-controlled catalog.
    command: sh -c "npm run db:migrate && npm run catalog:sync && npm run dev"

volumes:
  mysql-data:
